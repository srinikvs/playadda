plugins {
    id "com.android.application"
}

// API base for the leaderboard/auth calls. Build with -PapiEnv=test for the
// playaddatest server; anything else (including unset) means prod.
def apiBases = [
    prod: "https://playadda.duckdns.org",
    test: "https://playaddatest.duckdns.org",
]
def apiEnv = (project.findProperty("apiEnv") ?: "prod").toString()
def apiBase = apiBases.get(apiEnv, apiBases.prod)

android {
    namespace "com.playadda.offline"
    compileSdk 34
    defaultConfig {
        applicationId "com.playadda.offline"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.2.6"
        buildConfigField "String", "API_BASE", "\"${apiBase}\""
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
